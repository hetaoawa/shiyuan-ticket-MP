# 激活开发环境 Profile
spring.profiles.active=dev

# Flyway migration policy: existing production databases must be baselined manually at V16.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# External inbound orders remain pending for at least one minute before a
# bounded, tenant-aware automatic assignment attempt.
workorder.external-auto-assignment.enabled=true
workorder.external-auto-assignment.fixed-delay-ms=10000
workorder.external-auto-assignment.minimum-age-seconds=60
workorder.external-auto-assignment.batch-size=100


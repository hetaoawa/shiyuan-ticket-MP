# 激活开发环境 Profile
spring.profiles.active=dev

# Flyway migration policy: existing production databases must be baselined manually at V16.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# External inbound orders remain pending for at least one minute before a
# bounded, tenant-aware automatic assignment attempt.
workorder.external-auto-assignment.enabled=true
workorder.external-auto-assignment.fixed-delay-ms=10000
workorder.external-auto-assignment.minimum-age-seconds=60
workorder.external-auto-assignment.batch-size=100

# Webhook aggregation is isolated per tenant/channel/recipient and bounded by both size and age.
webhook.aggregate-delay-seconds=10
webhook.aggregate-max-batch-size=100
webhook.aggregate-max-wait-seconds=60
webhook.aggregate-dispatch-threads=4
webhook.aggregate-dispatch-queue-capacity=200
webhook.aggregate-shutdown-await-seconds=30
webhook.aggregate-deadletter-threads=2
webhook.aggregate-deadletter-queue-capacity=1000
webhook.aggregate-deadletter-await-seconds=30
webhook.receiver.dedupe-ttl-seconds=600

